; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = t-watch2020-v3

[env:emulator_twatch2020]
platform = native@^1.1.3
extra_scripts = support/sdl2_build_extra.py
build_type = release
build_flags =
  ${env.build_flags}
  ; Add recursive dirs for hal headers search
  ;!python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
  -lSDL2
  -llibcurl
  -llibmosquitto
  -D LV_CONF_SKIP
  -D LV_HOR_RES_MAX=240
  -D LV_VER_RES_MAX=240
  -D LV_MEM_CUSTOM=1
  -D LV_USE_USER_DATA=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D USE_MONITOR
  -D MONITOR_ZOOM=2
  -D USE_MOUSE
  -D NATIVE_64BIT
  -D LILYGO_WATCH_2020_V1
lib_archive = false
lib_deps =
  ${env.lib_deps}
  https://github.com/lvgl/lvgl.git#v7.7.2
  lv_drivers@~7.11.0
  ArduinoJson@~6.21.0
build_src_filter =
  +<*>
  +<../hal/sdl2>
  
[env:t-watch2020-v3]
platform_packages = framework-arduinoespressif32 @ https://github.com/sharandac/arduino-esp32-hedge.git
platform = espressif32@3.3.0
board = ttgo-t-watch
framework = arduino
lib_archive = true
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = 
	default
	esp32_exception_decoder
board_build.embed_txtfiles = 
	src/gui/mainbar/setup_tile/time_settings/timezones.json
	src/utils/osm_map/osmtileserver.json
build_src_filter = 
	+<*>
lib_deps = 
	https://github.com/dervomsee/TTGO_TWatch_Library/archive/refs/heads/lvgl_update.zip
	https://github.com/lvgl/lvgl.git#v7.11.0
	https://github.com/Shinoa-Fores/ESPAsyncWebServer.git
	https://github.com/dplasa/FTPClientServer.git
	AsyncTCP@>=1.1.1
	ArduinoJson@>=6.15.2
	luc-github/ESP32SSDP
	IRremoteESP8266@>=2.7.10,<=2.8.4
	PubSubClient@>=2.8
	earlephilhower/ESP8266Audio@1.9.5
	earlephilhower/ESP8266SAM
	https://github.com/tobozo/ESP32-targz/archive/refs/heads/1.0.5-beta.zip
	https://github.com/mobizt/ESP-Mail-Client.git#v2.4.8
	mikalhart/TinyGPSPlus
	https://github.com/linuxthor/LibSSH-ESP32/archive/1.2.3.tar.gz
	https://github.com/pschatzmann/ESP32-A2DP.git#v1.6.0
	h2zero/NimBLE-Arduino @ ^1.3.8
build_type = release
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=5
	-D LILYGO_WATCH_2020_V3
	-D SERIAL_RX_BUFFER_SIZE=256
	-mfix-esp32-psram-cache-issue
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Os
